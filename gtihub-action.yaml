name: Build and Publish Docker Images

# Trigger the workflow on pushes to the main branch
on:
  push:
    branches:
      - main
    # Only run if code in these directories actually changes
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
  # Allows you to trigger the workflow manually from the GitHub UI
  workflow_dispatch: 

jobs:
  build-and-push-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Tags with both 'latest' and the immutable Git commit SHA
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-backend:${{ github.sha }}
          # Uses GitHub Actions cache to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/goal-tracker-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
